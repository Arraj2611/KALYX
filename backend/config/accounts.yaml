accounts:
  zerodha_fno:
    broker: zerodha
    segments: [FNO]
    mode: paper
    credentials_env:
      api_key: ZERODHA_API_KEY
      api_secret: ZERODHA_API_SECRET

  groww_equity:
    broker: groww
    segments: [CASH]
    mode: paper
    credentials_env:
      api_key: GROWW_API_KEY
      totp_secret: GROWW_TOTP_SECRET

  paper_test:
    broker: paper
    segments: [CASH, FNO]
    mode: paper
    config:
      initial_capital: 1000000
      slippage_pct: 0.05
    agents:
      enabled: true
      eval_interval_seconds: 60
      watched_symbols: ["NIFTY", "RELIANCE"]
      debate:
        enabled: false
      guardian:
        max_loss_day: 100000
        max_capital_pct: 90
        max_trades_day: 100
        min_confidence: 0.5
        max_position_concentration_pct: 50
      memory:
        recall_limit: 10
      llm:
        quick_model: deepseek-v4-flash
        deep_model: deepseek-v4-flash
        ollama_base_url: http://localhost:11434
      prompts_dir: prompts/defaults/
